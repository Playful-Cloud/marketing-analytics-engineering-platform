## Schema for Marketing Analytics Models

version: 2

models:

## dim_campaign: This model represents the campaign dimension, containing one descriptive record per marketing campaign. It includes attributes such as campaign ID, name, start and end dates, channel, region, target audience, product category, device, and year. The model is designed to provide a comprehensive view of marketing campaigns for analytics purposes.

  - name: dim_campaign
    description: "Campaign dimension containing one descriptive record per campaign."

    columns:

      - name: campaign_id
        description: "Unique identifier for each marketing campaign."
        data_tests:
          - not_null
          - unique

      - name: campaign_name
        description: "Name of the marketing campaign."
        data_tests:
          - not_null

      - name: start_date
        description: "Campaign start date."
        data_tests:
          - not_null

      - name: end_date
        description: "Campaign end date."
        data_tests:
          - not_null

      - name: channel
        description: "Marketing channel used by the campaign."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Display
                  - Email
                  - Print
                  - Search
                  - Social

      - name: region
        description: "Geographic region associated with the campaign."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Africa
                  - Asia
                  - Europe
                  - North America
                  - South America

      - name: target_audience
        description: "Target audience category for the campaign."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Adults
                  - Seniors
                  - Youth

      - name: product_category
        description: "Product category associated with the campaign."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Automotive
                  - Clothing
                  - Electronics
                  - Health
                  - Home
                  - Services
                  - Travel

      - name: device
        description: "Device category associated with the campaign."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Desktop
                  - Mobile
                  - Tablet

      - name: year
        description: "Year associated with the campaign."
        data_tests:
          - not_null


## fct_campaign_performance: This model represents the campaign performance fact table, containing one measurable record per marketing campaign. It includes metrics such as impressions, clicks, conversions, spend in USD, and revenue in USD. The model is designed to provide a comprehensive view of campaign performance for analytics purposes.

  - name: fct_campaign_performance
    description: "Campaign performance fact containing one measurable record per campaign."

    columns:

      - name: campaign_id
        description: "Campaign identifier linking performance to the campaign dimension."
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_campaign')
                field: campaign_id

      - name: impressions
        description: "Total impressions generated by the campaign."
        data_tests:
          - not_null

      - name: clicks
        description: "Total clicks generated by the campaign."
        data_tests:
          - not_null

      - name: conversions
        description: "Total conversions generated by the campaign."
        data_tests:
          - not_null

      - name: spend_usd
        description: "Total campaign spend in USD."
        data_tests:
          - not_null

      - name: revenue_usd
        description: "Total campaign revenue in USD."
        data_tests:
          - not_null